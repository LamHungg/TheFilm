<div class="thefilm-movie-card" (click)="onCardClick()">
  <!-- Pure 2:3 Cinema Poster Container -->
  <div class="poster-artwork">
    <img
      [src]="movie.posterUrl"
      [alt]="movie.title"
      class="poster-photo"
      loading="lazy"
    />

    <!-- Top Floating Badges: Age Rating & IMDb/TheFilm Score -->
    <div class="poster-top-bar">
      <span class="rating-pill" [ngClass]="'rating-' + (movie.rating || 'P').toLowerCase()">
        {{ movie.rating }}
      </span>
      <span class="score-pill" *ngIf="movie.score">
        <span class="star">★</span> {{ movie.score }}
      </span>
    </div>

    <!-- Bottom Floating Format Chips over Poster Gradient -->
    <div class="poster-bottom-bar">
      <span class="format-tag" *ngFor="let fmt of movie.formats">{{ fmt }}</span>
    </div>
  </div>

  <!-- Movie Details Body -->
  <div class="movie-card-body">
    <span class="category-kicker">{{ movie.category || (movie.genres[0] | uppercase) }}</span>
    <h3 class="movie-title" [title]="movie.title">{{ movie.title }}</h3>
    <p class="movie-meta">{{ getMetaString() }}</p>

    <button class="btn-select-showtime" (click)="onBtnClick($event)">
      <span>ĐẶT VÉ NGAY</span>
      <span class="arrow">→</span>
    </button>
  </div>
</div>
