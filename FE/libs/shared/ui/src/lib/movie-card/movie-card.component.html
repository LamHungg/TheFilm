<div class="thefilm-movie-card" (click)="onCardClick()">
  <!-- Clean Rounded Poster matching TIX ID Figma -->
  <div class="poster-frame" [ngClass]="['theme-' + (movie.figmaTheme || 'navy')]">
    <img
      *ngIf="!imageError && movie.posterUrl; else posterFallback"
      [src]="movie.posterUrl"
      [alt]="movie.title"
      class="poster-img"
      loading="lazy"
      (error)="onImageError()"
    />
    <ng-template #posterFallback>
      <div class="poster-fallback">
        <span class="fallback-cat">{{ movie.category || (movie.genres[0] | uppercase) }}</span>
        <div class="fallback-title">{{ movie.title }}</div>
      </div>
    </ng-template>
  </div>

  <!-- Movie Details Body (Centered TIX ID Figma Card Layout) -->
  <div class="movie-card-body">
    <h3 class="movie-title" [title]="movie.title">{{ movie.title }}</h3>
    <p class="movie-meta">{{ getMetaString() }}</p>

    <!-- TIX ID Signature 3-Badge Row: Gold + Red + Navy -->
    <div class="tix-badges-row">
      <span class="tix-badge badge-gold">{{ movie.rating || 'P' }}</span>
      <span class="tix-badge badge-red">{{ getPrimaryFormat() }}</span>
      <span class="tix-badge badge-navy">{{ getSecondaryBadge() }}</span>
    </div>

    <button type="button" class="btn-select-showtime" (click)="onBtnClick($event)">
      CHỌN SUẤT
    </button>
  </div>
</div>
