<div class="tix-auth-page" data-node-id="142:1443">
  <!-- Cinema Backdrop Image -->
  <div class="tix-backdrop-container" data-node-id="206:1360">
    <img
      src="/assets/auth/bg-cinema.png"
      alt="Cinema Theater"
      class="tix-backdrop-img"
    />
    <div class="tix-backdrop-overlay"></div>
  </div>

  <!-- Top-Left Back Button -->
  <button
    type="button"
    class="tix-back-btn"
    (click)="goBack()"
    aria-label="Quay lại"
    data-node-id="427:4318"
  >
    <img
      src="/assets/auth/arrow-left.svg"
      alt=""
      class="tix-back-icon"
      aria-hidden="true"
    />
    <span class="tix-back-text">Quay lại</span>
  </button>

  <!-- Login / Register Card Container -->
  <main class="tix-card-wrapper">
    <div class="tix-card" data-node-id="475:4932">
      <!-- Title -->
      <h1 class="tix-card-title">
        {{ isLoginMode ? 'Đăng nhập TIX ID' : 'Đăng ký TIX ID' }}
      </h1>

      <!-- Feedback / Error messages -->
      <div
        class="tix-alert tix-alert-error"
        *ngIf="errorMessage"
        role="alert"
        aria-live="assertive"
      >
        <span class="tix-alert-dot"></span>
        <span>{{ errorMessage }}</span>
      </div>

      <div
        class="tix-alert tix-alert-loading"
        *ngIf="isLoading"
        role="status"
        aria-live="polite"
      >
        <span class="tix-spinner" aria-hidden="true"></span>
        <span>{{ loadingMessage }}</span>
      </div>

      <!-- FORM: ĐĂNG NHẬP (LOGIN) -->
      <form
        *ngIf="isLoginMode"
        class="tix-form"
        (ngSubmit)="submitLogin()"
        autocomplete="on"
      >
        <!-- Field: Số điện thoại / Email -->
        <div class="tix-field-group">
          <label for="login-account" class="tix-label">SỐ ĐIỆN THOẠI / EMAIL</label>
          <div class="tix-input-box">
            <span class="tix-prefix" *ngIf="showPhonePrefix">{{ phonePrefix }}</span>
            <span class="tix-divider" *ngIf="showPhonePrefix"></span>
            <input
              id="login-account"
              type="text"
              name="loginEmail"
              class="tix-input"
              [(ngModel)]="loginEmail"
              placeholder="Nhập email hoặc số điện thoại"
              autocomplete="username"
              required
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Field: Mật khẩu -->
        <div class="tix-field-group">
          <label for="login-pwd" class="tix-label">MẬT KHẨU</label>
          <div class="tix-input-box">
            <input
              id="login-pwd"
              [type]="showPassword ? 'text' : 'password'"
              name="loginPassword"
              class="tix-input"
              [(ngModel)]="loginPassword"
              placeholder="Nhập thông tin mật khẩu"
              autocomplete="current-password"
              required
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="tix-eye-btn"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              <img
                [src]="showPassword ? '/assets/auth/eye-hide.svg' : '/assets/auth/eye-show.svg'"
                alt=""
                class="tix-eye-icon"
              />
            </button>
          </div>
        </div>

        <!-- Buttons: Submit & Switch -->
        <div class="tix-actions">
          <button
            type="submit"
            class="tix-btn-primary"
            [disabled]="isLoading"
          >
            Đăng nhập ngay
          </button>

          <p class="tix-switch-hint">Chưa có tài khoản?</p>

          <button
            type="button"
            class="tix-btn-secondary"
            [disabled]="isLoading"
            (click)="setMode(false)"
          >
            Đăng ký ngay
          </button>
        </div>
      </form>

      <!-- FORM: ĐĂNG KÝ (REGISTER) -->
      <form
        *ngIf="!isLoginMode"
        class="tix-form"
        (ngSubmit)="submitRegister()"
        autocomplete="on"
      >
        <!-- Field: Họ và tên -->
        <div class="tix-field-group">
          <label for="reg-name" class="tix-label">HỌ VÀ TÊN</label>
          <div class="tix-input-box">
            <input
              id="reg-name"
              type="text"
              name="regDisplayName"
              class="tix-input"
              [(ngModel)]="regDisplayName"
              placeholder="Nguyễn Văn A"
              autocomplete="name"
              required
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Field: Email -->
        <div class="tix-field-group">
          <label for="reg-email" class="tix-label">ĐỊA CHỈ EMAIL</label>
          <div class="tix-input-box">
            <input
              id="reg-email"
              type="email"
              name="regEmail"
              class="tix-input"
              [(ngModel)]="regEmail"
              placeholder="example@thefilm.vn"
              autocomplete="email"
              required
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Field: Số điện thoại -->
        <div class="tix-field-group">
          <label for="reg-phone" class="tix-label">SỐ ĐIỆN THOẠI</label>
          <div class="tix-input-box">
            <span class="tix-prefix">{{ phonePrefix }}</span>
            <span class="tix-divider"></span>
            <input
              id="reg-phone"
              type="tel"
              name="regPhone"
              class="tix-input"
              [(ngModel)]="regPhone"
              placeholder="912345678"
              autocomplete="tel"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Field: Mật khẩu -->
        <div class="tix-field-group">
          <label for="reg-pwd" class="tix-label">MẬT KHẨU</label>
          <div class="tix-input-box">
            <input
              id="reg-pwd"
              [type]="showRegPassword ? 'text' : 'password'"
              name="regPassword"
              class="tix-input"
              [(ngModel)]="regPassword"
              placeholder="Tối thiểu 6 ký tự"
              autocomplete="new-password"
              required
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="tix-eye-btn"
              (click)="toggleRegPasswordVisibility()"
              [attr.aria-label]="showRegPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              <img
                [src]="showRegPassword ? '/assets/auth/eye-hide.svg' : '/assets/auth/eye-show.svg'"
                alt=""
                class="tix-eye-icon"
              />
            </button>
          </div>
        </div>

        <!-- Field: Xác nhận mật khẩu -->
        <div class="tix-field-group">
          <label for="reg-pwd-confirm" class="tix-label">XÁC NHẬN MẬT KHẨU</label>
          <div class="tix-input-box">
            <input
              id="reg-pwd-confirm"
              [type]="showRegPassword ? 'text' : 'password'"
              name="regConfirmPassword"
              class="tix-input"
              [(ngModel)]="regConfirmPassword"
              placeholder="Nhập lại mật khẩu"
              autocomplete="new-password"
              required
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Buttons: Submit & Switch -->
        <div class="tix-actions">
          <button
            type="submit"
            class="tix-btn-primary"
            [disabled]="isLoading"
          >
            Đăng ký ngay
          </button>

          <p class="tix-switch-hint">Đã có tài khoản?</p>

          <button
            type="button"
            class="tix-btn-secondary"
            [disabled]="isLoading"
            (click)="setMode(true)"
          >
            Đăng nhập ngay
          </button>
        </div>
      </form>

      <!-- Quick dev test button if enabled -->
      <div class="tix-quick-test" *ngIf="quickTestAvailable">
        <button
          type="button"
          class="tix-btn-quick-test"
          [disabled]="isLoading"
          (click)="quickTestSignIn()"
        >
          ⚡ Đăng nhập nhanh để thử nghiệm (Dev Mode)
        </button>
      </div>

      <!-- Footer Copyright -->
      <footer class="tix-card-footer">
        <p>2024 TIX ID - TheFilm Cinema System</p>
      </footer>
    </div>
  </main>
</div>
