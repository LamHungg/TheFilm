spring:
  jpa:
    open-in-view: false
  application:
    name: thefilm-backend
  profiles:
    default: local
server:
  port: 8080
  shutdown: graceful

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4300

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: THEFILM Backend
    description: API đặt vé và quản lý chuỗi rạp

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:thefilmlocal;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql
