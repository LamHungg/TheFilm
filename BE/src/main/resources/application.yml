spring:
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  jpa:
    open-in-view: false
  application:
    name: thefilm-backend
  profiles:
    default: oracle
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
  shutdown: graceful

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  mail:
    from: ${SMTP_FROM:no-reply@thefilm.vn}

thefilm:
  media:
    poster-directory: ${THEFILM_MEDIA_DIR:${user.home}/.thefilm/media/posters}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: THEFILM Backend
    description: API đặt vé và quản lý chuỗi rạp

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:thefilmlocal;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
