spring:
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    # THEFILM_ORACLE_FULL_SCHEMA.sql provisions the complete schema directly.
    # Do not run V001-V005 against that schema; use the full schema as the source of truth.
    enabled: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      issuer: ${APP_SECURITY_JWT_ISSUER:http://localhost:8082/auth}

logging:
  level:
    org.springframework.jdbc.core: INFO
