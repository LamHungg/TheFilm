spring:
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

logging:
  level:
    org.springframework.jdbc.core: INFO
